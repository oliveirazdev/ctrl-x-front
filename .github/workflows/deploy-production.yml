name: Deploy production
on:
  push:
    branches: [prod]
permissions:
  contents: read
  actions: read
concurrency:
  group: frontend-production
  cancel-in-progress: false
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  validate:
    name: Validate production
    uses: ./.github/workflows/frontend.yml
  production:
    name: Publish production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_vJdkGC4SQreqnD8LhiDl7rnqtPC9
      VERCEL_CLI_VERSION: '50.0.0'
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Validate required configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo '::error::VERCEL_TOKEN is unavailable. Set it as an environment secret in Settings > Environments > production > Environment secrets.'
            exit 1
          fi
          if [[ -z "$VERCEL_ORG_ID" ]]; then
            echo '::error::VERCEL_ORG_ID is unavailable. Set it as an environment secret in Settings > Environments > production.'
            exit 1
          fi
          node scripts/validate-production-config.mjs
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo '::error::VERCEL_TOKEN is unavailable. Set it as an environment secret in Settings > Environments > production.'
            exit 1
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Validate linked project and Production API configuration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { loadEnvConfig } = require('@next/env');
          if (!fs.existsSync('.vercel/project.json')) {
            console.error('::error::Vercel configuration is missing after vercel pull. Check VERCEL_TOKEN, VERCEL_ORG_ID and project access.');
            process.exit(1);
          }
          const project = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (project.projectId !== process.env.VERCEL_PROJECT_ID || project.orgId !== process.env.VERCEL_ORG_ID) {
            console.error('::error::Vercel project or organization does not match the configured target.');
            process.exit(1);
          }
          if (config.framework !== 'nextjs' || config.installCommand !== 'npm ci' || config.buildCommand !== 'npm run build') {
            console.error('::error::vercel.json must select nextjs, installCommand npm ci and buildCommand npm run build without literal shell quotes.');
            process.exit(1);
          }
          if (config.git?.deploymentEnabled !== false) {
            console.error('::error::Set git.deploymentEnabled to false to keep Git deployments disabled.');
            process.exit(1);
          }
          const settings = project.settings ?? {};
          if (settings.rootDirectory && !['.', './'].includes(settings.rootDirectory)) {
            console.error('::error::Set Vercel Root Directory to the repository root containing package.json.');
            process.exit(1);
          }
          if (settings.installCommand != null && settings.installCommand !== config.installCommand) {
            console.warn('::warning::Vercel dashboard Install Command differs from vercel.json. The repository override uses npm ci. Align the dashboard command without literal quotes.');
          }
          console.log('Verified target project, repository root, Next.js preset, npm ci and npm run build.');
          loadEnvConfig('.vercel', false, { info() {}, error() {} });
          try {
            const api = new URL(process.env.NEXT_PUBLIC_API_URL);
            const base = new URL(process.env.NEXT_PUBLIC_API_BASE_URL);
            const isLocal = (url) => ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname);
            if (!process.env.NEXT_PUBLIC_API_URL || !process.env.NEXT_PUBLIC_API_BASE_URL) throw new Error('missing');
            if (api.protocol !== 'https:' || api.pathname.replace(/\/$/, '') !== '/api/v1' || api.username || api.password || api.search || api.hash || isLocal(api)) throw new Error('invalid api url');
            if (base.protocol !== 'https:' || base.pathname.replace(/\/$/, '') !== '/api/v1' || base.username || base.password || base.search || base.hash || isLocal(base)) throw new Error('invalid api base url');
            if (api.origin !== base.origin || api.pathname.replace(/\/$/, '') !== base.pathname.replace(/\/$/, '')) throw new Error('api urls differ');
          } catch {
            console.error('::error::Set NEXT_PUBLIC_API_URL and NEXT_PUBLIC_API_BASE_URL in Vercel Production to the same real HTTPS backend origin ending in /api/v1. Values must not point to localhost.');
            process.exit(1);
          }
          NODE
      - name: Ensure production branch is current before deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$REPOSITORY/commits/prod" --jq '.sha')
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo '::error::prod advanced during this run. Stop before publishing this obsolete commit.'
            exit 1
          fi
      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Validate build output
        run: test -s .vercel/output/config.json
      - name: Publish validated artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" > deployment-url.txt
          URL=$(tail -n 1 deployment-url.txt)
          [[ "$URL" == https://* ]]
          echo "Published commit $GITHUB_SHA to $URL" >> "$GITHUB_STEP_SUMMARY"
          vercel inspect "$URL" --wait --token="$VERCEL_TOKEN"
      - name: Check production health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 20 "${PRODUCTION_URL%/}/" -o /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 20 "${PRODUCTION_URL%/}/api/health" -o health.json
          node -e "const h=require('./health.json'); if(h.status!=='ok') process.exit(1)"
      - name: Record failure
        if: failure()
        run: echo 'Production publication or validation failed. Review the failed step and follow CI-CD.md for rollback.' >> "$GITHUB_STEP_SUMMARY"
