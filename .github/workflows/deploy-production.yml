name: Deploy production
on:
  push:
    branches: [prod]
permissions:
  contents: read
concurrency:
  group: frontend-production
  cancel-in-progress: false
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  production:
    name: Publish production
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_vJdkGC4SQreqnD8LhiDl7rnqtPC9
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@50.0.0
      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Skip obsolete commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$REPOSITORY/git/ref/heads/prod" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped publication: prod has a newer commit.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish production artifact
        if: steps.current.outputs.publish == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" > deployment-url.txt
          URL=$(tail -n 1 deployment-url.txt)
          vercel inspect "$URL" --wait --token="$VERCEL_TOKEN"
          echo "Published commit $GITHUB_SHA to $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Record failure
        if: failure()
        run: echo 'Production deployment failed. Inspect the failed step; follow CI-CD.md for rollback.' >> "$GITHUB_STEP_SUMMARY"
