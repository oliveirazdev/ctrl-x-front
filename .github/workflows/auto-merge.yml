name: Enable pull request auto-merge
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [develop, prod]
permissions:
  contents: read
  pull-requests: write
jobs:
  enable:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && ((github.event.pull_request.base.ref == 'develop' && startsWith(github.event.pull_request.head.ref, 'feature/')) || (github.event.pull_request.base.ref == 'prod' && github.event.pull_request.head.ref == 'develop'))
    runs-on: ubuntu-latest
    steps:
      - name: Enable native squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
