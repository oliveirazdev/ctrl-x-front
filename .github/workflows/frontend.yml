name: Frontend
on:
  pull_request:
    branches: [develop, prod]
  push:
    branches: [develop]
  workflow_call:
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
    steps:
      - name: Validate promotion path
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ "$BASE_BRANCH" == prod ]]; then
            if [[ "$HEAD_BRANCH" != develop || "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              echo '::error::Production PRs must originate from develop in this repository.'
              exit 1
            fi
          elif [[ "$HEAD_BRANCH" != feature/* ]]; then
            echo '::error::Develop PRs must originate from feature/*.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
