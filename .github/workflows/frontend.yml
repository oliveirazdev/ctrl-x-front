name: Frontend
on:
  pull_request:
    branches: [develop, prod]
  push:
    branches: [develop, prod]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git log --format=%s "$BASE_SHA..$HEAD_SHA" | while IFS= read -r subject; do
            if ! [[ "$subject" =~ ^(feat|fix|refactor|tests):[[:space:]]+[a-z][a-z0-9[:space:]]*$ ]]; then
              echo "Invalid commit subject: $subject" >&2
              echo "Expected type: short imperative description in English." >&2
              exit 1
            fi
          done
  production:
    name: Publish production
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: ci
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate configuration
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          [[ "$PRODUCTION_URL" == https://* ]]
          [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - run: npm ci
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Validate build output
        run: test -s .vercel/output/config.json
      - name: Publish validated artifact
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" > deployment-url.txt
          URL=$(tail -n 1 deployment-url.txt)
          [[ "$URL" == https://* ]]
          echo "Published commit $GITHUB_SHA to $URL" >> "$GITHUB_STEP_SUMMARY"
          vercel inspect "$URL" --wait --token="$VERCEL_TOKEN"
      - name: Check production health
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 20 "${PRODUCTION_URL%/}/" -o /dev/null
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 20 "${PRODUCTION_URL%/}/api/health" -o health.json
          node -e "const h=require('./health.json'); if(h.status!=='ok') process.exit(1)"
      - name: Record failure
        if: failure()
        run: echo 'Production publication or validation failed. Review the failed step and follow CI-CD.md for rollback.' >> "$GITHUB_STEP_SUMMARY"
